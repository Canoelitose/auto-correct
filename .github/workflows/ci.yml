name: CI

on:
  push:
    branches:
      - '**'
      # Release branches are handled by release.yml, which builds and tests as well.
      - '!release/**'
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AutoCorrect.sln

      - name: Build
        run: dotnet build AutoCorrect.sln -c Release --no-restore

      # ---------------------------------------------------------------- LanguageTool
      # The integration tests talk to a real server instead of a stub. The download is
      # cached, so it only costs time on the first run.

      - name: Cache LanguageTool
        id: languagetool-cache
        uses: actions/cache@v4
        with:
          path: languagetool
          key: languagetool-6.6

      - name: Download LanguageTool
        if: steps.languagetool-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://languagetool.org/download/LanguageTool-6.6.zip' -OutFile lt.zip
          Expand-Archive lt.zip -DestinationPath lt-extract
          New-Item -ItemType Directory -Force -Path languagetool | Out-Null
          Move-Item lt-extract/LanguageTool-6.6/* languagetool/
          Remove-Item lt.zip, lt-extract -Recurse -Force

      - name: Start LanguageTool
        shell: pwsh
        run: |
          Start-Process -FilePath 'java' -WorkingDirectory 'languagetool' -WindowStyle Hidden `
            -ArgumentList '-cp', 'languagetool-server.jar;libs/*', 'org.languagetool.server.HTTPServer', '--port', '8081'

          # The first start loads the language models and takes a while.
          $ready = $false
          foreach ($attempt in 1..60) {
              try {
                  Invoke-RestMethod -Uri 'http://localhost:8081/v2/languages' -TimeoutSec 5 | Out-Null
                  $ready = $true
                  break
              } catch {
                  Start-Sleep -Seconds 2
              }
          }

          if (-not $ready) { throw 'LanguageTool did not start within 120 seconds.' }
          Write-Host 'LanguageTool is up.'

      # ---------------------------------------------------------------- tests

      - name: Core tests (including the LanguageTool integration tests)
        env:
          AUTOCORRECT_LT_ENDPOINT: http://localhost:8081/v2/check
        run: dotnet run --project tests/AutoCorrect.Core.Tests -c Release --no-build

      - name: Windows tests (tray, hotkeys, clipboard, popup, insertion)
        shell: pwsh
        run: |
          $exe = 'tests/AutoCorrect.App.Tests/bin/Release/net8.0-windows/AutoCorrect.App.Tests.exe'
          & $exe
          if ($LASTEXITCODE -ne 0) { throw "Windows tests failed with exit code $LASTEXITCODE" }

      - name: Publish smoke test
        run: >
          dotnet publish src/AutoCorrect.App/AutoCorrect.App.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=none
          -o publish/smoke

      - name: Check the published output really is one file
        shell: pwsh
        run: |
          # The SQLite cache brings a native e_sqlite3.dll along. Without
          # IncludeNativeLibrariesForSelfExtract it would sit next to the exe, and the release
          # ships only the exe - the cache would silently disappear for everyone who downloads.
          $files = Get-ChildItem publish/smoke -File
          $files | ForEach-Object { Write-Host "  $($_.Name)  $([math]::Round($_.Length/1MB, 2)) MB" }

          if ($files.Count -ne 1 -or $files[0].Name -ne 'AutoCorrect.exe') {
              throw "expected a single AutoCorrect.exe, found: $($files.Name -join ', ')"
          }

      - name: Start the published application and check it survives
        shell: pwsh
        run: |
          # Proves the executable really runs: it starts, stays alive as a tray application
          # and writes its log. Nothing here needs a visible window.
          $exe = Resolve-Path publish/smoke/AutoCorrect.exe
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12

          if ($process.HasExited) {
              throw "The application exited on its own with code $($process.ExitCode)."
          }

          Write-Host "The application is running (PID $($process.Id))."
          Stop-Process -Id $process.Id -Force
          Start-Sleep -Seconds 2

          $log = Join-Path $env:LOCALAPPDATA 'AutoCorrect/logs/autocorrect.log'
          if (Test-Path $log) {
              Write-Host '--- log ---'
              Get-Content $log
          }
