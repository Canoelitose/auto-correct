name: Release

# Three ways to cut a release:
#   1. push a tag such as v1.0.0
#   2. push a branch release/v1.0.0 - the workflow creates the tag itself
#   3. run it manually from the Actions tab and type the tag
on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the release, for example v1.0.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    # A Windows runner on purpose: it is the only place where the WPF build is also
    # exercised on the target platform.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AutoCorrect.sln

      - name: Build
        run: dotnet build AutoCorrect.sln -c Release --no-restore

      - name: Logic and language tests
        run: dotnet run --project tests/AutoCorrect.Core.Tests -c Release --no-build

      - name: Windows tests (tray, hotkeys, clipboard, popup, insertion)
        shell: pwsh
        run: |
          $exe = 'tests/AutoCorrect.App.Tests/bin/Release/net8.0-windows/AutoCorrect.App.Tests.exe'
          & $exe
          if ($LASTEXITCODE -ne 0) { throw "Windows tests failed with exit code $LASTEXITCODE" }

      - name: Publish self-contained (no runtime needed on the target machine)
        run: >
          dotnet publish src/AutoCorrect.App/AutoCorrect.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish/self-contained

      - name: Publish framework-dependent (needs the .NET 8 Desktop Runtime)
        run: >
          dotnet publish src/AutoCorrect.App/AutoCorrect.App.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=none
          -o publish/framework-dependent

      - name: Name the artefacts
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $env:GITHUB_REF_NAME
          } elseif ($env:GITHUB_REF_NAME -like 'release/*') {
              # Branch release/v1.0.0 -> tag v1.0.0. The release step creates the tag.
              $env:GITHUB_REF_NAME -replace '^release/', ''
          } else {
              '${{ inputs.tag }}'
          }

          if (-not $tag) { throw 'No tag could be determined for this run.' }
          Write-Host "Release tag: $tag"
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item publish/self-contained/AutoCorrect.exe      "dist/AutoCorrect-$tag-win-x64.exe"
          Copy-Item publish/framework-dependent/AutoCorrect.exe "dist/AutoCorrect-$tag-win-x64-runtime-required.exe"

          # A checksum file, so a download can be verified.
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
          } | Out-File -Encoding ascii dist/SHA256SUMS.txt

          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artefacts to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: AutoCorrect-${{ env.TAG }}
          path: dist/*

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          # Created at this commit when the tag does not exist yet.
          target_commitish: ${{ github.sha }}
          name: AutoCorrect ${{ env.TAG }}
          # Anything with a suffix such as -phase1 or -rc1 is published as a pre-release.
          prerelease: ${{ contains(env.TAG, '-') }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## Download

            | Datei | Grösse | Voraussetzung |
            |---|---|---|
            | `AutoCorrect-${{ env.TAG }}-win-x64.exe` | ca. 63 MB | keine – einfach starten |
            | `AutoCorrect-${{ env.TAG }}-win-x64-runtime-required.exe` | ca. 0.4 MB | .NET 8 Desktop Runtime |

            Windows 10 (1809+) oder Windows 11, x64.

            ## Sprachen

            Deutsch und Englisch stecken in derselben Exe, es gibt keine getrennten
            Sprachversionen.

            - **Oberfläche**: Tray-Icon → *Einstellungen* → *Sprache der Oberfläche*.
              Umschaltung wirkt sofort, ohne Neustart. Voreinstellung folgt der
              Windows-Anzeigesprache.
            - **Sprache des Textes**: standardmässig *Automatisch* – deutsche und englische
              Texte werden im selben Ablauf erkannt und korrigiert, ohne etwas umzustellen.
              Schweizer Schreibung bleibt erhalten (`ss`, kein `ß`).

            ## Vor dem ersten Start

            AutoCorrect braucht einen lokal laufenden LanguageTool-Server:

            ```powershell
            java -cp "languagetool-server.jar;libs/*" org.languagetool.server.HTTPServer --port 8081
            ```

            Anleitung: [docs/SETUP-LANGUAGETOOL.md](https://github.com/${{ github.repository }}/blob/${{ env.TAG }}/docs/SETUP-LANGUAGETOOL.md)

            ## Benutzen

            **Wichtig:** AutoCorrect hat kein eigenes Fenster. Nach dem Start erscheint beim
            ersten Mal ein kurzes Begrüssungsfenster, danach läuft es nur noch als Symbol im
            Infobereich der Taskleiste (rechts unten neben der Uhr). Unter Windows 11 versteckt
            Windows neue Symbole hinter dem Pfeil `^` – von dort lässt es sich auf die
            Taskleiste ziehen.

            | Taste | Wirkung |
            |---|---|
            | `Win + Leertaste` | Text markieren, Hotkey drücken, Popup mit der Korrektur erscheint |
            | `Enter` | Ergebnis übernehmen und einfügen |
            | `Esc` | abbrechen |
            | `Ctrl + C` | Ergebnis nur kopieren |

            ## Hinweise

            - `Win + Leertaste` ist ab Werk der Hotkey. Windows benutzt die Kombination sonst
              für den Tastaturlayout-Wechsel; AutoCorrect fängt sie über einen
              Low-Level-Tastaturhaken ab, der Layout-Wechsel entfällt dadurch. In den
              Einstellungen lässt sich jede andere Kombination wählen.
            - Die Exe ist nicht signiert. SmartScreen meldet sich beim ersten Start:
              *Weitere Informationen* → *Trotzdem ausführen*.
            - Anwendungen mit Administratorrechten sind für ein normal laufendes Tool
              nicht lesbar (Windows-Sicherheitsgrenze UIPI).
            - Prüfsummen stehen in `SHA256SUMS.txt`.

      - name: Remove the release branch
        # The tag now carries the release; the temporary branch has served its purpose.
        if: success() && startsWith(github.ref, 'refs/heads/release/')
        run: git push origin --delete "${{ github.ref_name }}"
